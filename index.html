<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC Tracker PRO - João</title>
    <style>
        :root { --fc-red: #fe0000; --fc-green: #00ff85; --bg: #050505; --card-bg: #121212; --text: #ffffff; --star: #f1c40f; --border: #2a2a2a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; margin: 0; padding-bottom: 80px; }

        .header-container { position: sticky; top: 0; background: rgba(5,5,5,0.97); backdrop-filter: blur(10px); z-index: 100; padding: 12px 0 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; text-align: center; }
        h1 { color: #fff; text-transform: uppercase; font-size: 1rem; letter-spacing: 3px; margin: 0 0 8px; font-weight: 900; }
        h1 span { color: var(--fc-red); }

        .global-progress { margin: 0 8px 8px; }
        .global-progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .global-progress-label span { font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .global-progress-label strong { font-size: 0.95rem; font-weight: 900; color: var(--fc-green); }
        .global-bar-bg { background: #1a1a1a; height: 5px; border-radius: 3px; overflow: hidden; }
        .global-bar { background: linear-gradient(90deg, var(--fc-red), var(--fc-green)); height: 100%; border-radius: 3px; transition: width 0.4s ease; }

        .tabs { display: flex; border-top: 1px solid var(--border); margin-top: 8px; }
        .tab-btn { flex: 1; padding: 10px 2px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: transparent; color: #444; border: none; cursor: pointer; border-top: 2px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: #fff; border-top-color: var(--fc-red); }
        .tab-btn.tab-done.active { border-top-color: var(--fc-green); color: var(--fc-green); }
        .tab-btn.tab-exp.active { border-top-color: #555; color: #777; }
        .tab-badge { display: inline-block; background: #222; border-radius: 20px; padding: 1px 6px; font-size: 0.55rem; margin-left: 3px; }

        .toggle-row { text-align: center; padding: 8px 0 12px; }
        .toggle-btn { background: #1a1a1a; color: #fff; border: 1px solid var(--border); padding: 7px 16px; border-radius: 25px; font-size: 0.65rem; font-weight: 600; cursor: pointer; }
        .toggle-btn.active { background: var(--fc-red); border-color: var(--fc-red); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .category-header { border-left: 5px solid var(--fc-red); padding: 10px 15px; margin: 25px 0 10px; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; background: linear-gradient(90deg, #1a1a1a, transparent); display: flex; justify-content: space-between; align-items: center; }
        .category-header.fav { border-left-color: var(--star); color: var(--star); }
        .category-header.exp { border-left-color: #444; color: #555; }
        .category-header.done-cat { border-left-color: var(--fc-green); }
        .cat-pct { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: #1a1a1a; border: 1px solid var(--border); }
        .cat-pct.full { color: var(--fc-green); border-color: var(--fc-green); }

        .card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--border); }
        .card.expired { opacity: 0.55; }
        .card.completed { border-color: #003322; }
        .player-name { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 2px; display: block; }

        .card-progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-progress-bar-bg { flex: 1; background: #1a1a1a; height: 3px; border-radius: 2px; margin-right: 8px; overflow: hidden; }
        .card-progress-bar { height: 100%; border-radius: 2px; background: var(--fc-red); transition: width 0.3s; }
        .card-progress-bar.full { background: var(--fc-green); }
        .card-pct-label { font-size: 0.65rem; font-weight: 700; min-width: 60px; text-align: right; color: #888; }
        .card-pct-label.full { color: var(--fc-green); }

        .expira-label { font-size: 0.6rem; font-weight: 600; display: block; margin-bottom: 6px; }
        .expira-label.soon { color: #ff6600; }
        .expira-label.expired-lbl { color: #555; }
        .expira-label.never { color: #333; }

        .req-box { background: #1e1e1e; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 0.75rem; color: #bbb; width: 100%; box-sizing: border-box; font-family: inherit; resize: none; }
        .sub-obj { background: #1a1a1a; margin-bottom: 12px; padding: 12px; border-radius: 10px; border: 1px solid #252525; position: relative; }
        .sub-obj.done { opacity: 0.5; border-color: var(--fc-green); }
        .fav-sub-star { position: absolute; top: 10px; right: 12px; font-size: 1.2rem; color: #333; cursor: pointer; }
        .fav-sub-star.active { color: var(--star); }
        .info { margin-bottom: 10px; padding-right: 30px; }
        .nome-text { font-size: 0.75rem; color: #eee; font-weight: 600; display: block; margin-bottom: 4px; line-height: 1.3; }
        .count { font-weight: bold; font-family: monospace; color: var(--fc-red); font-size: 0.7rem; }
        .progress-bg { background: #000; height: 4px; border-radius: 2px; margin-bottom: 12px; }
        .progress-bar { background: var(--fc-red); height: 100%; border-radius: 2px; transition: width 0.3s; }
        .progress-bar.full { background: var(--fc-green); }
        .balls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 8px; }
        .ball { aspect-ratio: 1/1; border: 1px solid #333; border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; opacity: 0.3; }
        .ball.active { opacity: 1; border-color: var(--fc-green); background: #002211; }
        .ball.readonly { cursor: default; }

        .empty-state { text-align: center; padding: 50px 20px; color: #444; font-size: 0.85rem; line-height: 2; }
        .reset-btn { display: block; width: 80%; margin: 40px auto; padding: 12px; background: transparent; border: 1px solid #333; color: #666; border-radius: 8px; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>

    const JSONBIN_KEY = '$2a$10$rkJwuFm6CQYGT0xS8jLZrOh80qsO7Q7Hz0VaNdLIGRnxtOcImy6Aa';
    const BIN_NAME = 'fc-tracker-joao';
    const FIXED_BIN_ID = '6a19ee8921f9ee59d29b5db1';
    let BIN_ID = FIXED_BIN_ID;
    localStorage.setItem('fc_bin_id', FIXED_BIN_ID);
    let syncTimeout = null;
    let isSyncing = false;

    function setSyncStatus(status) {
        const el = document.getElementById('sync-status');
        if (!el) return;
        const map = {
            ok:      { icon: '☁️', text: 'Salvo', color: '#00ff85' },
            saving:  { icon: '⏳', text: 'Salvando...', color: '#f1c40f' },
            loading: { icon: '⏳', text: 'Carregando...', color: '#f1c40f' },
            error:   { icon: '⚠️', text: 'Erro de sinc', color: '#fe0000' },
            offline: { icon: '📴', text: 'Offline', color: '#888' }
        };
        const s = map[status] || map.ok;
        el.innerHTML = `<span style="color:${s.color}">${s.icon} ${s.text}</span>`;
    }

    async function criarBin(dados) {
        try {
            const res = await fetch('https://api.jsonbin.io/v3/b', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Name': BIN_NAME, 'X-Bin-Private': 'true' },
                body: JSON.stringify(dados)
            });
            const json = await res.json();
            BIN_ID = json.metadata.id;
            localStorage.setItem('fc_bin_id', BIN_ID);
            return true;
        } catch(e) { return false; }
    }

    async function carregarNuvem() {
        if (!BIN_ID) return false;
        try {
            setSyncStatus('loading');
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': JSONBIN_KEY }
            });
            if (!res.ok) { setSyncStatus('error'); return false; }
            const json = await res.json();
            const dados = json.record;
            progresso  = dados.progresso  || {};
            subFavs    = dados.subFavs    || [];
            requisitos = dados.requisitos || {};
            localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
            localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
            localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
            setSyncStatus('ok');
            return true;
        } catch(e) { setSyncStatus('offline'); return false; }
    }

    async function salvarNuvem() {
        isSyncing = true;
        setSyncStatus('saving');
        const dados = { progresso, subFavs, requisitos };
        try {
            if (!BIN_ID) {
                await criarBin(dados);
            } else {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
                    body: JSON.stringify(dados)
                });
                if (!res.ok) throw new Error('Falha');
            }
            localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
            localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
            localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
            localStorage.setItem('fc_bin_id', BIN_ID);
            setSyncStatus('ok');
        } catch(e) {
            setSyncStatus('error');
            localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
            localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
            localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
        }
        isSyncing = false;
    }

    function salvar() {
        localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
        localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
        localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
        clearTimeout(syncTimeout);
        syncTimeout = setTimeout(salvarNuvem, 1500);
    }

    const MESES = {jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
    function parseExpira(str) {
        if (!str) return null;
        const p = str.trim().toLowerCase().split(' ');
        if (p.length < 3) return null;
        const d = parseInt(p[0]), m = MESES[p[1]], y = parseInt(p[2]);
        if (isNaN(d) || m === undefined || isNaN(y)) return null;
        return new Date(y, m, d, 5, 0, 0);
    }

    function isExpired(group) {
        const d = parseExpira(group.expira);
        return d ? new Date() >= d : false;
    }

    function isGroupCompleted(gIdx) {
        const group = OBJETIVOS[gIdx];
        const needed = group.minToComplete || group.tasks.length;
        let done = 0;
        group.tasks.forEach((t, tIdx) => { if ((progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total) done++; });
        return done >= needed;
    }

    let progresso  = JSON.parse(localStorage.getItem('fc_joao_full_v1')) || {};
    let subFavs    = JSON.parse(localStorage.getItem('fc_favs_full_v1')) || [];
    let requisitos = JSON.parse(localStorage.getItem('fc_reqs_full_v1')) || {};
    let esconderAtivo = false;

    async function limparTudo() {
        if (!confirm("Deseja resetar todo o progresso?")) return;
        progresso = {}; subFavs = []; requisitos = {};
        await salvarNuvem();
        localStorage.clear();
        location.reload();
    }

    async function iniciar() {
        setSyncStatus('loading');
        const ok = await carregarNuvem();
        if (!ok && !BIN_ID) {
            await criarBin({ progresso, subFavs, requisitos });
            setSyncStatus('ok');
        }
        render();
    }

    function setTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="setTab('${tab}')"]`).classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    }

    function toggleFiltro() {
        esconderAtivo = !esconderAtivo;
        document.getElementById('toggleTaskBtn').classList.toggle('active', esconderAtivo);
        render();
    }

    function toggleSubFav(id) {
        subFavs = subFavs.includes(id) ? subFavs.filter(f => f !== id) : [...subFavs, id];
        salvar(); render();
    }

    function verificarAutoCompletar(gIdx) {
        const group = OBJETIVOS[gIdx];
        if (!group.minToComplete) return;
        let done = group.tasks.filter((t, tIdx) => (progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total).length;
        if (done >= group.minToComplete) group.tasks.forEach((t, tIdx) => progresso[`g${gIdx}t${tIdx}`] = t.total);
    }

    function calcGroupProgress(gIdx) {
        const group = OBJETIVOS[gIdx];
        let done = 0;
        group.tasks.forEach((t, tIdx) => { if ((progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total) done++; });
        const total = group.minToComplete || group.tasks.length;
        const counted = Math.min(done, total);
        return { done: counted, total, pct: Math.round((counted / total) * 100) };
    }

    function createTaskHTML(task, id, player, gIdx, isFavContext, readonly) {
        const valor = progresso[id] || 0;
        const isDone = valor >= task.total;
        if (!readonly && esconderAtivo && isDone && !isFavContext) return null;

        const isFav = subFavs.includes(id);
        const pct = Math.min(100, Math.round((valor / task.total) * 100));
        const div = document.createElement('div');
        div.className = 'sub-obj' + (isDone ? ' done' : '');
        div.innerHTML = `
            <div class="fav-sub-star ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleSubFav('${id}')">★</div>
            <div class="info">
                <span class="nome-text">${isFavContext ? '<b>[' + player + ']</b> ' : ''}${task.nome}</span>
                <span class="count">${valor}/${task.total} &bull; ${pct}%</span>
            </div>
            <div class="progress-bg"><div class="progress-bar ${isDone ? 'full' : ''}" style="width:${pct}%"></div></div>
            <div class="balls-grid"></div>
        `;
        const grid = div.querySelector('.balls-grid');
        for (let i = 1; i <= task.total; i++) {
            const ball = document.createElement('div');
            ball.className = 'ball' + (i <= valor ? ' active' : '') + (readonly ? ' readonly' : '');
            ball.innerText = '⚽';
            if (!readonly) {
                ball.onclick = () => {
                    progresso[id] = (valor === i) ? i - 1 : i;
                    verificarAutoCompletar(gIdx);
                    salvar(); render();
                };
            }
            grid.appendChild(ball);
        }
        return div;
    }

    function buildCard(group, gIdx, extraClass, readonly) {
        const gp = calcGroupProgress(gIdx);
        const expired = isExpired(group);
        const card = document.createElement('div');
        card.className = 'card' + (extraClass ? ' ' + extraClass : '');

        let expiLabel = '';
        if (!group.expira) expiLabel = `<span class="expira-label never">∞ Não expira</span>`;
        else if (expired) expiLabel = `<span class="expira-label expired-lbl">💀 Expirado: ${group.expira}</span>`;
        else expiLabel = `<span class="expira-label soon">⏳ Expira: ${group.expira}</span>`;

        const headerRow = document.createElement('div');
        headerRow.innerHTML = `
            <span class="player-name">${group.minToComplete ? `<small style="color:var(--fc-green)">[Completar ${group.minToComplete} de ${group.tasks.length}]</small> ` : ''}${group.player}</span>
            ${expiLabel}
        `;
        card.appendChild(headerRow);

        const progRow = document.createElement('div');
        progRow.className = 'card-progress-row';
        progRow.innerHTML = `
            <div class="card-progress-bar-bg"><div class="card-progress-bar ${gp.pct === 100 ? 'full' : ''}" style="width:${gp.pct}%"></div></div>
            <span class="card-pct-label ${gp.pct === 100 ? 'full' : ''}">${gp.done}/${gp.total} (${gp.pct}%)</span>
        `;
        card.appendChild(progRow);

        const req = document.createElement('textarea');
        req.className = 'req-box';
        req.placeholder = "Notas de requisitos/combos...";
        req.value = requisitos['req-' + gIdx] || '';
        req.oninput = (e) => { requisitos['req-' + gIdx] = e.target.value; salvar(); };
        card.appendChild(req);

        group.tasks.forEach((task, tIdx) => {
            const html = createTaskHTML(task, `g${gIdx}t${tIdx}`, group.player, gIdx, false, readonly);
            if (html) card.appendChild(html);
        });

        return card;
    }

    function renderSection(indices, container, catClass, readonly) {
        let lastCat = '';
        indices.forEach(gIdx => {
            const group = OBJETIVOS[gIdx];
            if (catClass !== '' && group.cat !== lastCat) {
                const catIdxs = indices.filter(i => OBJETIVOS[i].cat === group.cat);
                let catDone = 0, catTotal = 0;
                catIdxs.forEach(i => { const p = calcGroupProgress(i); catDone += p.done; catTotal += p.total; });
                const catPct = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;
                const h = document.createElement('div');
                h.className = 'category-header ' + catClass;
                h.innerHTML = `<span>${group.cat}</span><span class="cat-pct ${catPct === 100 ? 'full' : ''}">${catPct}%</span>`;
                container.appendChild(h);
                lastCat = group.cat;
            } else if (catClass === '' && group.cat !== lastCat) {
                const h = document.createElement('div');
                h.className = 'category-header';
                h.style.opacity = '0.5';
                h.style.fontSize = '0.7rem';
                h.innerHTML = `<span>${group.cat}</span>`;
                container.appendChild(h);
                lastCat = group.cat;
            }
            const card = buildCard(group, gIdx, catClass === 'exp' ? 'expired' : catClass === 'done-cat' ? 'completed' : '', readonly);
            if (catClass === '' && esconderAtivo) {
                const hasTasks = card.querySelectorAll('.sub-obj').length > 0;
                if (!hasTasks) return;
            }
            container.appendChild(card);
        });
    }

    function render() {
        const appAtivos = document.getElementById('app-ativos');
        const appConcluidos = document.getElementById('app-concluidos');
        const appExpirados = document.getElementById('app-expirados');
        const favCont = document.getElementById('fav-container');
        appAtivos.innerHTML = ''; appConcluidos.innerHTML = ''; appExpirados.innerHTML = ''; favCont.innerHTML = '';

        const ativos = [], concluidos = [], expirados = [];
        OBJETIVOS.forEach((group, gIdx) => {
            if (isExpired(group)) expirados.push(gIdx);
            else if (isGroupCompleted(gIdx)) concluidos.push(gIdx);
            else ativos.push(gIdx);
        });

        ativos.sort((a, b) => {
            const dA = parseExpira(OBJETIVOS[a].expira);
            const dB = parseExpira(OBJETIVOS[b].expira);
            if (dA && dB) return dA - dB;
            if (dA) return -1;
            if (dB) return 1;
            return 0;
        });

        document.getElementById('badge-ativos').textContent = ativos.length;
        document.getElementById('badge-concluidos').textContent = concluidos.length;
        document.getElementById('badge-expirados').textContent = expirados.length;

        let gDone = 0, gTotal = 0;
        ativos.forEach(gIdx => { const p = calcGroupProgress(gIdx); gDone += p.done; gTotal += p.total; });
        const gPct = gTotal > 0 ? Math.round((gDone / gTotal) * 100) : 0;
        document.getElementById('global-pct-text').textContent = gPct + '%';
        document.getElementById('global-bar').style.width = gPct + '%';

        if (subFavs.length > 0) {
            const head = document.createElement('div'); head.className = 'category-header fav'; head.innerText = '⭐ Em Foco'; favCont.appendChild(head);
            const card = document.createElement('div'); card.className = 'card';
            let hasFavs = false;
            OBJETIVOS.forEach((group, gIdx) => group.tasks.forEach((task, tIdx) => {
                const id = `g${gIdx}t${tIdx}`;
                if (subFavs.includes(id)) {
                    const html = createTaskHTML(task, id, group.player, gIdx, true, false);
                    if (html) { card.appendChild(html); hasFavs = true; }
                }
            }));
            if (hasFavs) favCont.appendChild(card);
        }

        if (ativos.length === 0) appAtivos.innerHTML = '<div class="empty-state">Nenhum objetivo ativo no momento 🎉</div>';
        else renderSection(ativos, appAtivos, '', false);

        if (concluidos.length === 0) appConcluidos.innerHTML = '<div class="empty-state">Nenhum objetivo concluído ainda.<br>Vai jogar! ⚽</div>';
        else renderSection(concluidos, appConcluidos, 'done-cat', false);

        if (expirados.length === 0) appExpirados.innerHTML = '<div class="empty-state">Nenhum objetivo expirado. Boa! 👍</div>';
        else renderSection(expirados, appExpirados, 'exp', true);
    }

    iniciar();
</script>
</body>
</html>
