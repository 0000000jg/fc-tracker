<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC Tracker PRO - Objectives</title>
    <style>
        :root {
            --fc-red: #fe0000;
            --fc-green: #00ff85;
            --fc-amber: #f1c40f;
            --bg: #0a0a0f;
            --card-bg: #12121a;
            --text: #ffffff;
            --border: #2a2a35;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0d0d15 50%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Header */
        .header-container {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: 16px 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--fc-red), #ff6b35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        h1 span { color: var(--fc-red); }

        /* Global Progress */
        .global-progress {
            background: linear-gradient(135deg, rgba(30,30,40,0.8), rgba(20,20,30,0.8));
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .global-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .global-progress-label {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .global-progress-value {
            font-size: 24px;
            font-weight: 900;
            color: var(--fc-green);
        }

        .global-bar-bg {
            background: #1a1a25;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .global-bar {
            background: linear-gradient(90deg, var(--fc-red), #ff6b35, var(--fc-amber));
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .global-bar.complete {
            background: linear-gradient(90deg, var(--fc-green), #00cc6a);
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: transparent;
            color: #555;
            border: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-btn.active {
            color: #fff;
        }

        .tab-btn[data-tab="live"].active { border-bottom-color: var(--fc-red); color: #ff6b6b; }
        .tab-btn[data-tab="milestones"].active { border-bottom-color: var(--fc-amber); color: var(--fc-amber); }
        .tab-btn[data-tab="campaign"].active { border-bottom-color: #3b82f6; color: #60a5fa; }
        .tab-btn[data-tab="completed"].active { border-bottom-color: var(--fc-green); color: var(--fc-green); }

        .tab-badge {
            background: #222;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }

        .tab-btn.active .tab-badge { background: rgba(255,255,255,0.15); }

        /* Main Content */
        .main-content {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Toggle Button */
        .toggle-row {
            text-align: center;
            padding: 12px 0;
        }

        .toggle-btn {
            background: #1a1a25;
            color: #888;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: rgba(254, 0, 0, 0.15);
            border-color: var(--fc-red);
            color: #ff6b6b;
        }

        /* Category Header */
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            margin: 20px 0 12px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 13px;
            border-left: 4px solid;
        }

        .category-header.live {
            background: linear-gradient(90deg, rgba(254,0,0,0.1), transparent);
            border-left-color: var(--fc-red);
        }

        .category-header.milestones {
            background: linear-gradient(90deg, rgba(241,196,15,0.1), transparent);
            border-left-color: var(--fc-amber);
        }

        .category-header.campaign {
            background: linear-gradient(90deg, rgba(59,130,246,0.1), transparent);
            border-left-color: #3b82f6;
        }

        .category-header.completed {
            background: linear-gradient(90deg, rgba(0,255,133,0.1), transparent);
            border-left-color: var(--fc-green);
        }

        .cat-pct {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
        }

        .cat-pct.full { color: var(--fc-green); border-color: var(--fc-green); }

        /* Partial Completion Alert */
        .partial-alert {
            background: linear-gradient(90deg, rgba(241,196,15,0.1), rgba(255,107,53,0.05));
            border: 1px solid rgba(241,196,15,0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #fcd34d;
        }

        .partial-alert-icon { font-size: 18px; }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s;
        }

        .card.complete {
            border-color: rgba(0, 255, 133, 0.3);
            background: linear-gradient(135deg, rgba(0,60,30,0.2), rgba(0,40,20,0.1));
        }

        .card.partial {
            border-color: rgba(241, 196, 15, 0.3);
        }

        /* Card Banner */
        .card-banner {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-banner.partial-banner {
            background: linear-gradient(90deg, rgba(241,196,15,0.15), rgba(255,107,53,0.1));
            border-bottom: 1px solid rgba(241,196,15,0.2);
            color: #fcd34d;
        }

        .card-banner.complete-banner {
            background: linear-gradient(90deg, rgba(0,255,133,0.15), rgba(0,200,100,0.1));
            border-bottom: 1px solid rgba(0,255,133,0.2);
            color: var(--fc-green);
        }

        /* Card Header */
        .card-header {
            padding: 16px;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
        }

        .card-header:hover { background: rgba(255,255,255,0.04); }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .player-name {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .card.complete .player-name { color: var(--fc-green); }

        .expire-info {
            font-size: 11px;
            color: #666;
        }

        .expire-info.soon { color: #ff9500; }
        .expire-info.urgent { color: var(--fc-red); }

        .expand-icon {
            color: #666;
            transition: transform 0.3s;
        }

        .card.expanded .expand-icon { transform: rotate(180deg); }

        /* Progress Section */
        .card-progress {
            padding: 0 16px 16px;
            background: rgba(255,255,255,0.02);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .progress-values {
            font-size: 13px;
            font-weight: 700;
            color: #ccc;
        }

        .card.complete .progress-values { color: var(--fc-green); }

        .progress-pct {
            font-size: 13px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }

        .card.complete .progress-pct {
            background: rgba(0,255,133,0.15);
            color: var(--fc-green);
        }

        .progress-bar-bg {
            background: #1a1a25;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            background: linear-gradient(90deg, var(--fc-red), #ff6b35, var(--fc-amber));
        }

        .card.complete .progress-bar {
            background: linear-gradient(90deg, var(--fc-green), #00cc6a);
        }

        /* Threshold Marker */
        .threshold-marker {
            position: absolute;
            top: 0;
            height: 100%;
            border-right: 2px dashed var(--fc-amber);
        }

        .threshold-label {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--fc-amber);
            font-weight: 700;
            white-space: nowrap;
        }

        /* Completion Rule */
        .completion-rule {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            font-size: 11px;
            color: #aaa;
        }

        .card.complete .completion-rule {
            background: rgba(0,255,133,0.05);
            border-color: rgba(0,255,133,0.2);
            color: #6ee7b7;
        }

        /* Group Reward */
        .group-reward-toggle {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: var(--fc-amber);
            transition: color 0.2s;
        }

        .group-reward-toggle:hover { color: #fcd34d; }

        .card.complete .group-reward-toggle { color: var(--fc-green); }

        .group-reward-box {
            margin-top: 8px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(241,196,15,0.1), rgba(255,107,53,0.05));
            border: 1px solid rgba(241,196,15,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #fcd34d;
            display: none;
        }

        .group-reward-box.show { display: block; }

        .card.complete .group-reward-box {
            background: rgba(0,255,133,0.08);
            border-color: rgba(0,255,133,0.3);
            color: var(--fc-green);
        }

        /* Tasks */
        .tasks-container {
            padding: 16px;
            display: none;
        }

        .card.expanded .tasks-container { display: block; }

        .tasks-header {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* Sub-Objective (Task) */
        .sub-obj {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            position: relative;
        }

        .sub-obj.done {
            opacity: 0.6;
            border-color: rgba(0,255,133,0.3);
            background: rgba(0,60,30,0.1);
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .sub-name {
            font-size: 14px;
            font-weight: 700;
            color: #eee;
        }

        .sub-obj.done .sub-name { color: var(--fc-green); }

        .fav-star {
            font-size: 18px;
            color: #444;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fav-star.active { color: var(--fc-amber); }
        .fav-star:hover { transform: scale(1.2); }

        /* Requirement Box - ALWAYS VISIBLE */
        .req-box {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #bbb;
        }

        .req-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            margin-bottom: 6px;
            display: block;
        }

        .sub-obj.done .req-box {
            border-color: rgba(0,255,133,0.2);
            color: #6ee7b7;
        }

        .sub-obj.done .req-label { color: rgba(0,255,133,0.6); }

        /* Reward Toggle */
        .reward-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--fc-amber);
            cursor: pointer;
            margin-bottom: 10px;
        }

        .reward-box {
            background: linear-gradient(135deg, rgba(241,196,15,0.08), rgba(255,107,53,0.05));
            border: 1px solid rgba(241,196,15,0.2);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #fcd34d;
            display: none;
        }

        .reward-box.show { display: block; }

        .sub-obj.done .reward-box {
            background: rgba(0,255,133,0.08);
            border-color: rgba(0,255,133,0.2);
            color: var(--fc-green);
        }

        /* Progress */
        .sub-progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .sub-progress-values {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
        }

        .sub-obj.done .sub-progress-values { color: var(--fc-green); }

        .sub-progress-pct {
            font-size: 12px;
            font-weight: 800;
            color: #888;
        }

        .sub-progress-bar-bg {
            background: #1a1a25;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .sub-progress-bar {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--fc-red), #ff6b35);
            transition: width 0.4s ease;
        }

        .sub-obj.done .sub-progress-bar {
            background: var(--fc-green);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-minus, .btn-plus {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-minus {
            background: #1a1a25;
            color: #888;
            border: 1px solid var(--border);
        }

        .btn-minus:hover:not(:disabled) { background: #252530; }

        .btn-plus {
            background: linear-gradient(135deg, var(--fc-red), #ff6b35);
            color: #fff;
        }

        .btn-plus:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(254,0,0,0.3);
        }

        .btn-plus:disabled {
            background: var(--fc-green);
            cursor: default;
        }

        .btn-minus:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Progress Balls */
        .balls-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #333;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ball.active {
            border-color: var(--fc-green);
            background: linear-gradient(135deg, var(--fc-green), #00cc6a);
            color: #fff;
            box-shadow: 0 0 10px rgba(0,255,133,0.3);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #555;
            font-size: 14px;
        }

        /* Reset Button */
        .reset-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 40px auto 20px;
            padding: 14px;
            background: transparent;
            border: 1px solid #333;
            color: #666;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: #555;
            color: #aaa;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .main-content { padding: 24px; }
            .card { border-radius: 20px; }
        }
    </style>
</head>
<body>
<div class="header-container">
    <div class="logo">
        <div class="logo-icon">FC</div>
        <h1>TRACKER <span>PRO</span></h1>
    </div>

    <div class="global-progress">
        <div class="global-progress-header">
            <span class="global-progress-label">Progresso Geral</span>
            <span class="global-progress-value" id="global-pct">0%</span>
        </div>
        <div class="global-bar-bg">
            <div class="global-bar" id="global-bar" style="width:0%"></div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="live">
            Live Events
            <span class="tab-badge" id="badge-live">0</span>
        </button>
        <button class="tab-btn" data-tab="milestones">
            Marcos
            <span class="tab-badge" id="badge-milestones">0</span>
        </button>
        <button class="tab-btn" data-tab="campaign">
            Campanha
            <span class="tab-badge" id="badge-campaign">0</span>
        </button>
        <button class="tab-btn" data-tab="completed">
            Concluidos
            <span class="tab-badge" id="badge-completed">0</span>
        </button>
    </div>
</div>

<div class="main-content">
    <div class="toggle-row">
        <button class="toggle-btn" id="toggleBtn">Esconder Concluidos</button>
    </div>

    <div id="tab-live" class="tab-content active"></div>
    <div id="tab-milestones" class="tab-content"></div>
    <div id="tab-campaign" class="tab-content"></div>
    <div id="tab-completed" class="tab-content"></div>

    <button class="reset-btn" onclick="resetAll()">LIMPAR TUDO E REINICIAR</button>
</div>

// ==================== STATE ====================
let progress = JSON.parse(localStorage.getItem('fc-tracker-progress-v4')) || {};
let favorites = JSON.parse(localStorage.getItem('fc-tracker-favs-v4')) || [];
let hideCompleted = false;

function save() {
    localStorage.setItem('fc-tracker-progress-v4', JSON.stringify(progress));
    localStorage.setItem('fc-tracker-favs-v4', JSON.stringify(favorites));
}

function resetAll() {
    if (!confirm('Deseja resetar todo o progresso?')) return;
    progress = {};
    favorites = [];
    save();
    render();
}

// ==================== HELPERS ====================
function getProgress(taskId) {
    return progress[taskId] || 0;
}

function isComplete(group) {
    const needed = group.minToComplete || group.tasks.length;
    let done = 0;
    group.tasks.forEach(t => {
        if (getProgress(t.id) >= t.total) done++;
    });
    return done >= needed;
}

function calcGroupProgress(group) {
    const needed = group.minToComplete || group.tasks.length;
    let done = 0;
    group.tasks.forEach(t => {
        if (getProgress(t.id) >= t.total) done++;
    });
    return { done: Math.min(done, needed), total: needed, pct: Math.round((Math.min(done, needed) / needed) * 100) };
}

// ==================== RENDER ====================
function render() {
    const containers = {
        live: document.getElementById('tab-live'),
        milestones: document.getElementById('tab-milestones'),
        campaign: document.getElementById('tab-campaign'),
        completed: document.getElementById('tab-completed')
    };

    Object.values(containers).forEach(c => c.innerHTML = '');

    const categorized = { live: [], milestones: [], campaign: [], completed: [] };
    const partialGroups = [];

    OBJECTIVES.forEach(group => {
        const complete = isComplete(group);
        if (complete) {
            categorized.completed.push(group);
        } else {
            categorized[group.category].push(group);
        }
        if (group.minToComplete && group.minToComplete < group.tasks.length) {
            partialGroups.push(group);
        }
    });

    // Update global progress
    let totalNeeded = 0, totalDone = 0;
    OBJECTIVES.forEach(g => {
        if (!isComplete(g)) {
            const p = calcGroupProgress(g);
            totalNeeded += p.total;
            totalDone += p.done;
        }
    });
    const globalPct = totalNeeded > 0 ? Math.round((totalDone / totalNeeded) * 100) : 100;
    document.getElementById('global-pct').textContent = globalPct + '%';
    document.getElementById('global-bar').style.width = globalPct + '%';
    document.getElementById('global-bar').className = 'global-bar' + (globalPct === 100 ? ' complete' : '');

    // Update badges
    document.getElementById('badge-live').textContent = categorized.live.length;
    document.getElementById('badge-milestones').textContent = categorized.milestones.length;
    document.getElementById('badge-campaign').textContent = categorized.campaign.length;
    document.getElementById('badge-completed').textContent = categorized.completed.length;

    // Render each category
    renderCategory('live', categorized.live, containers.live, 'Live Events');
    renderCategory('milestones', categorized.milestones, containers.milestones, 'Marcos de Paises (Europa)', partialGroups.filter(g => g.category === 'milestones'));
    renderCategory('campaign', categorized.campaign, containers.campaign, 'Campanha e Temporada');
    renderCategory('completed', categorized.completed, containers.completed, 'Objetivos Concluidos');

    // Empty states
    Object.entries(containers).forEach(([key, container]) => {
        if (container.innerHTML === '') {
            const msg = key === 'completed' ? 'Nenhum objetivo concluido ainda.<br>Vai jogar!' : 'Nenhum objetivo ativo.';
            container.innerHTML = `<div class="empty-state">${msg}</div>`;
        }
    });
}

function renderCategory(catClass, groups, container, title, partialGroupsList = []) {
    if (groups.length === 0) return;

    // Category header
    let catDone = 0, catTotal = 0;
    groups.forEach(g => {
        const p = calcGroupProgress(g);
        catDone += p.done;
        catTotal += p.total;
    });
    const catPct = Math.round((catDone / catTotal) * 100);

    container.innerHTML += `
        <div class="category-header ${catClass}">
            <span>${title}</span>
            <span class="cat-pct ${catPct === 100 ? 'full' : ''}">${catPct}%</span>
        </div>
    `;

    // Partial completion alert
    if (partialGroupsList.length > 0) {
        container.innerHTML += `
            <div class="partial-alert">
                <span class="partial-alert-icon">!</span>
                <span><b>${partialGroupsList.length} grupo${partialGroupsList.length > 1 ? 's' : ''}</b> com conclusao parcial - voce nao precisa completar 100% das missoes!</span>
            </div>
        `;
    }

    groups.forEach(group => renderCard(group, container));
}

function renderCard(group, container) {
    const gp = calcGroupProgress(group);
    const complete = isComplete(group);
    const isPartial = group.minToComplete && group.minToComplete < group.tasks.length;

    let thresholdHtml = '';
    if (isPartial && !complete) {
        const thresholdPct = (group.minToComplete / group.tasks.length) * 100;
        thresholdHtml = `
            <div class="threshold-marker" style="left: ${thresholdPct}%;">
                <span class="threshold-label">Min: ${group.minToComplete}</span>
            </div>
        `;
    }

    let bannerHtml = '';
    if (isPartial && !complete) {
        bannerHtml = `
            <div class="card-banner partial-banner">
                <span>!</span>
                <span><b>${group.minToComplete} de ${group.tasks.length}</b> missoes necessarias (nao precisa completar todas!)</span>
            </div>
        `;
    } else if (complete) {
        bannerHtml = `<div class="card-banner complete-banner"><span>OK</span><span>Grupo completo!</span></div>`;
    }

    let tasksHtml = '';
    group.tasks.forEach(task => {
        const val = getProgress(task.id);
        const taskDone = val >= task.total;
        if (hideCompleted && taskDone) return;

        const isFav = favorites.includes(task.id);
        const pct = Math.min(100, Math.round((val / task.total) * 100));

        let ballsHtml = '';
        if (task.total > 1 && task.total <= 20) {
            for (let i = 1; i <= task.total; i++) {
                ballsHtml += `<div class="ball ${i <= val ? 'active' : ''}" onclick="setProgress('${task.id}', ${i}, ${task.total})">${i <= val ? 'OK' : i}</div>`;
            }
        }

        tasksHtml += `
            <div class="sub-obj ${taskDone ? 'done' : ''}">
                <div class="sub-header">
                    <span class="sub-name">${task.name}</span>
                    <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFav('${task.id}')">★</span>
                </div>
                <div class="req-box">
                    <span class="req-label">Requisito</span>
                    ${task.requirement}
                </div>
                <div class="reward-toggle" onclick="this.nextElementSibling.classList.toggle('show')">
                    <span>+ Ver recompensa</span>
                </div>
                <div class="reward-box">${task.reward}</div>
                <div class="sub-progress-header">
                    <span class="sub-progress-values">${val}/${task.total}</span>
                    <span class="sub-progress-pct">${pct}%</span>
                </div>
                <div class="sub-progress-bar-bg">
                    <div class="sub-progress-bar ${taskDone ? 'complete' : ''}" style="width:${pct}%"></div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div class="balls-grid">${ballsHtml}</div>
                    <div class="btn-group">
                        <button class="btn-minus" onclick="decProgress('${task.id}')" ${val <= 0 ? 'disabled' : ''}>-</button>
                        <button class="btn-plus" onclick="incProgress('${task.id}', ${task.total})" ${taskDone ? 'disabled' : ''}>${taskDone ? 'OK' : '+'}</button>
                    </div>
                </div>
            </div>
        `;
    });

    if (hideCompleted) {
        const hiddenCount = group.tasks.filter(t => getProgress(t.id) >= t.total).length;
        if (hiddenCount > 0) {
            tasksHtml += `<div style="text-align:center;padding:8px;color:#555;font-size:11px;">+ ${hiddenCount} missoes ja completadas (ocultas)</div>`;
        }
    }

    container.innerHTML += `
        <div class="card ${complete ? 'complete' : ''} ${isPartial && !complete ? 'partial' : ''} expanded" id="card-${group.id}">
            ${bannerHtml}
            <div class="card-header" onclick="toggleCard('${group.id}')">
                <div class="card-title-row">
                    <div>
                        <div class="player-name">${group.name}</div>
                        ${group.expiresIn ? `<span class="expire-info ${parseInt(group.expiresIn) <= 5 ? 'soon' : ''}">Expira em: ${group.expiresIn}</span>` : ''}
                    </div>
                    <span class="expand-icon">v</span>
                </div>
            </div>
            <div class="card-progress">
                <div class="progress-header">
                    <span class="progress-values">${gp.done}/${gp.total} objetivos</span>
                    <span class="progress-pct">${gp.pct}%</span>
                </div>
                <div class="progress-bar-bg">
                    ${thresholdHtml}
                    <div class="progress-bar ${complete ? 'complete' : ''}" style="width:${gp.pct}%"></div>
                </div>
                <div class="completion-rule">${group.completionRule}</div>
                ${group.groupReward ? `
                    <div class="group-reward-toggle" onclick="this.nextElementSibling.classList.toggle('show')">
                        <span>Recompensa do grupo</span>
                    </div>
                    <div class="group-reward-box">${group.groupReward}</div>
                ` : ''}
            </div>
            <div class="tasks-container">
                <div class="tasks-header">Missoes (${group.tasks.filter(t => getProgress(t.id) >= t.total).length}/${group.tasks.length} completas${isPartial ? ` - minimo ${group.minToComplete} necessarias` : ''})</div>
                ${tasksHtml || '<div class="empty-state">Todas as missoes completas!</div>'}
            </div>
        </div>
    `;
}

// ==================== ACTIONS ====================
function setProgress(taskId, val, max) {
    const current = getProgress(taskId);
    progress[taskId] = val === current ? val - 1 : val;
    if (progress[taskId] < 0) progress[taskId] = 0;
    if (progress[taskId] > max) progress[taskId] = max;
    save();
    render();
}

function incProgress(taskId, max) {
    const current = getProgress(taskId);
    if (current < max) {
        progress[taskId] = current + 1;
        save();
        render();
    }
}

function decProgress(taskId) {
    const current = getProgress(taskId);
    if (current > 0) {
        progress[taskId] = current - 1;
        save();
        render();
    }
}

function toggleFav(taskId) {
    if (favorites.includes(taskId)) {
        favorites = favorites.filter(f => f !== taskId);
    } else {
        favorites.push(taskId);
    }
    save();
    render();
}

function toggleCard(groupId) {
    document.getElementById('card-' + groupId).classList.toggle('expanded');
}

// ==================== TABS ====================
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const tab = this.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
    });
});

// ==================== TOGGLE ====================
document.getElementById('toggleBtn').addEventListener('click', function() {
    hideCompleted = !hideCompleted;
    this.classList.toggle('active', hideCompleted);
    this.textContent = hideCompleted ? 'Mostrar Concluidos' : 'Esconder Concluidos';
    render();
});

// ==================== INIT ====================
render();
</script>
