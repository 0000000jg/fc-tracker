<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c10" />
<title>FC Tracker PRO - João</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c10;
    --bg-soft: #0f1217;
    --surface: #14171d;
    --surface-2: #1b1f28;
    --surface-3: #232834;
    --border: #262b35;
    --border-soft: #1e222b;
    --text: #eef0f3;
    --muted: #8a909c;
    --muted-2: #5e636e;
    --green: #00e676;
    --green-dim: #0a3d29;
    --red: #ff2d55;
    --red-dim: #3d0f1a;
    --gold: #ffc928;
    --blue: #3b9dff;
    --radius: 18px;
    --shadow: 0 8px 24px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(0,230,118,0.06), transparent 60%),
      radial-gradient(800px 500px at -10% 0%, rgba(255,45,85,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 110px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  /* ── Header ── */
  .header-container {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 14px 0;
  }
  .header-inner { max-width: 720px; margin: 0 auto; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  h1 {
    font-size: 1.05rem; font-weight: 900; letter-spacing: 1px;
    margin: 0; display: flex; align-items: center; gap: 9px;
  }
  h1 .logo {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), #00b85f);
    display: grid; place-items: center; font-size: 1rem;
    box-shadow: 0 4px 14px rgba(0,230,118,0.35);
  }
  h1 span { color: var(--green); }
  .sync-pill {
    font-size: 0.62rem; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }

  .global-progress { margin-bottom: 12px; }
  .global-progress-label { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 7px; }
  .global-progress-label span { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; }
  .global-progress-label strong { font-size: 1.15rem; font-weight: 900; color: var(--green); line-height: 1; }
  .global-bar-bg { background: var(--surface-2); height: 8px; border-radius: 999px; overflow: hidden; border: 1px solid var(--border-soft); }
  .global-bar { background: linear-gradient(90deg, var(--green), #6fffb0); height: 100%; border-radius: 999px; transition: width 0.5s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 14px rgba(0,230,118,0.5); }

  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    flex: 1; padding: 11px 4px 13px; font-size: 0.68rem; font-weight: 700;
    background: transparent; color: var(--muted-2); border: none; cursor: pointer;
    border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab-btn .ico { font-size: 0.9rem; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--green); }
  .tab-btn.tab-exp.active { color: var(--muted); border-bottom-color: var(--muted-2); }
  .tab-badge {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 7px; font-size: 0.6rem; font-weight: 700; min-width: 20px; color: var(--muted);
  }
  .tab-btn.active .tab-badge { color: var(--text); border-color: var(--green); }

  /* ── Toolbar ── */
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 16px 0 4px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 160px; }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-size: 0.82rem; font-family: inherit; outline: none;
  }
  .search-box input:focus { border-color: var(--green); }
  .search-box .s-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted-2); font-size: 0.85rem; }
  .toggle-btn {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    padding: 11px 15px; border-radius: 12px; font-size: 0.72rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: all .2s;
  }
  .toggle-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .tab-content { display: none; animation: fade .25s ease; }
  .tab-content.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ── Category header ── */
  .category-header {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 15px; margin: 26px 0 12px; border-radius: 12px;
    background: linear-gradient(90deg, var(--surface-2), transparent 85%);
    border-left: 4px solid var(--green);
    font-weight: 800; font-size: 0.82rem; letter-spacing: 0.4px;
  }
  .category-header.fav { border-left-color: var(--gold); color: var(--gold); }
  .category-header.exp { border-left-color: var(--muted-2); color: var(--muted); }
  .category-header.done-cat { border-left-color: var(--green); }
  .cat-left { display: flex; align-items: center; gap: 9px; text-transform: uppercase; }
  .cat-pct { font-size: 0.7rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .cat-pct.full { color: var(--green); border-color: var(--green); }

  /* ── Card ── */
  .card {
    background: linear-gradient(180deg, var(--surface), var(--bg-soft));
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .card.expired { opacity: 0.6; }
  .card.completed { border-color: rgba(0,230,118,0.35); }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .player-name { font-size: 1.08rem; font-weight: 800; display: block; margin-bottom: 5px; line-height: 1.25; }
  .min-badge { display: inline-block; font-size: 0.6rem; font-weight: 800; color: var(--green); background: var(--green-dim); border: 1px solid rgba(0,230,118,0.3); padding: 2px 7px; border-radius: 6px; margin-right: 7px; vertical-align: middle; }
  .expira-label { font-size: 0.66rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; }
  .expira-label.soon { color: var(--red); background: var(--red-dim); }
  .expira-label.urgent { color: #fff; background: var(--red); }
  .expira-label.expired-lbl { color: var(--muted); background: var(--surface-2); }
  .expira-label.never { color: var(--muted-2); background: var(--surface-2); }

  .reward-final {
    display: flex; gap: 9px; align-items: flex-start;
    background: linear-gradient(90deg, rgba(255,201,40,0.1), transparent);
    border: 1px solid rgba(255,201,40,0.25); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 13px;
  }
  .reward-final .rf-ico { font-size: 0.95rem; line-height: 1.4; }
  .reward-final .rf-txt { font-size: 0.72rem; color: #f0d98a; font-weight: 600; line-height: 1.4; }
  .reward-final .rf-txt b { color: var(--gold); }

  .card-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-progress-bar-bg { flex: 1; background: var(--surface-2); height: 7px; border-radius: 999px; overflow: hidden; border: 1px solid var(--border-soft); }
  .card-progress-bar { height: 100%; border-radius: 999px; background: var(--red); transition: width .4s ease; }
  .card-progress-bar.full { background: var(--green); }
  .card-pct-label { font-size: 0.7rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .card-pct-label.full { color: var(--green); }

  .req-box {
    background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; font-size: 0.74rem; color: var(--muted);
    width: 100%; font-family: inherit; resize: vertical; min-height: 38px; outline: none;
  }
  .req-box:focus { border-color: var(--green); }

  /* ── Sub objective ── */
  .sub-obj { background: var(--surface-2); margin-bottom: 11px; padding: 13px 14px; border-radius: 13px; border: 1px solid var(--border-soft); position: relative; transition: opacity .2s; }
  .sub-obj.done { border-color: rgba(0,230,118,0.4); background: rgba(0,230,118,0.04); }
  .sub-obj.done .nome-text { color: var(--muted); }
  .fav-sub-star { position: absolute; top: 11px; right: 12px; font-size: 1.15rem; color: var(--muted-2); cursor: pointer; transition: transform .15s, color .15s; }
  .fav-sub-star:active { transform: scale(1.3); }
  .fav-sub-star.active { color: var(--gold); }

  .info { margin-bottom: 9px; padding-right: 30px; }
  .nome-text { font-size: 0.84rem; color: var(--text); font-weight: 700; display: block; margin-bottom: 3px; line-height: 1.3; }
  .nome-text .ctx { color: var(--green); font-weight: 800; }
  .desc-text { font-size: 0.7rem; color: var(--muted); line-height: 1.45; margin-bottom: 5px; }
  .reward-text { font-size: 0.68rem; color: #f0d98a; line-height: 1.4; display: flex; gap: 5px; align-items: flex-start; }
  .reward-text .r-ico { color: var(--gold); }
  .count { font-weight: 800; font-family: 'Inter', monospace; color: var(--muted); font-size: 0.7rem; }
  .count b { color: var(--red); }
  .count.full b { color: var(--green); }

  .progress-bg { background: var(--bg); height: 5px; border-radius: 999px; margin: 9px 0 12px; overflow: hidden; }
  .progress-bar { background: var(--red); height: 100%; border-radius: 999px; transition: width .3s; }
  .progress-bar.full { background: var(--green); }

  /* balls */
  .balls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 8px; }
  .ball {
    aspect-ratio: 1/1; border: 1px solid var(--border); border-radius: 50%; background: var(--bg);
    display: grid; place-items: center; font-size: 15px; cursor: pointer; opacity: 0.35; transition: all .15s;
  }
  .ball.active { opacity: 1; border-color: var(--green); background: rgba(0,230,118,0.12); box-shadow: 0 0 8px rgba(0,230,118,0.25); }
  .ball:not(.readonly):active { transform: scale(0.88); }
  .ball.readonly { cursor: default; }

  /* stepper */
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn {
    width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface-3); color: var(--text); font-size: 1.2rem; font-weight: 800;
    cursor: pointer; display: grid; place-items: center; transition: all .15s; flex-shrink: 0;
  }
  .step-btn:active { transform: scale(0.92); }
  .step-btn.plus { border-color: var(--green); color: var(--green); }
  .step-btn.minus { border-color: var(--red); color: var(--red); }
  .step-btn.readonly { opacity: 0.4; cursor: default; pointer-events: none; }
  .step-val { flex: 1; text-align: center; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .step-val small { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  .step-jump { font-size: 0.62rem; padding: 0 9px; height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .step-jump:active { transform: scale(0.92); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted-2); font-size: 0.9rem; line-height: 1.9; }
  .empty-state .es-ico { font-size: 2.4rem; display: block; margin-bottom: 10px; opacity: 0.6; }

  .reset-btn { display: block; width: 90%; max-width: 360px; margin: 36px auto 0; padding: 13px; background: transparent; border: 1px solid var(--border); color: var(--muted-2); border-radius: 12px; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all .2s; }
  .reset-btn:active { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="header-container">
  <div class="header-inner">
    <div class="header-top">
      <h1><span class="logo">⚽</span> FC TRACKER <span>PRO</span></h1>

    </div>

    <div class="tabs">

      <button class="tab-btn tab-exp" data-tab="expirados" onclick="setTab('expirados')"><span class="ico">💀</span> Expirados <span class="tab-badge" id="badge-expirados">0</span></button>
    </div>
  </div>
</div>

<div class="wrap">

    <div class="search-box">

  <div id="tab-expirados" class="tab-content">
    <div id="app-expirados"></div>
  </div>

  <button class="reset-btn" onclick="limparTudo()">LIMPAR TUDO E REINICIAR</button>
</div>

/* ── JSONBin Cloud Sync ── */
const JSONBIN_KEY = '$2a$10$rkJwuFm6CQYGT0xS8jLZrOh80qsO7Q7Hz0VaNdLIGRnxtOcImy6Aa';
const BIN_NAME = 'fc-tracker-joao';
const FIXED_BIN_ID = '6a19ee8921f9ee59d29b5db1';
let BIN_ID = FIXED_BIN_ID;
localStorage.setItem('fc_bin_id', FIXED_BIN_ID);
let syncTimeout = null;
let isSyncing = false;

function setSyncStatus(status) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    ok:      { icon: '☁️', text: 'Salvo', color: '#00e676' },
    saving:  { icon: '⏳', text: 'Salvando...', color: '#ffc928' },
    loading: { icon: '⏳', text: 'Carregando...', color: '#ffc928' },
    error:   { icon: '⚠️', text: 'Erro de sinc', color: '#ff2d55' },
    offline: { icon: '📴', text: 'Offline', color: '#8a909c' }
  };
  const s = map[status] || map.ok;
  el.innerHTML = `<span class="sync-dot" style="background:${s.color}"></span><span style="color:${s.color}">${s.text}</span>`;
}

async function criarBin(dados) {
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Name': BIN_NAME, 'X-Bin-Private': 'true' },
      body: JSON.stringify(dados)
    });
    const json = await res.json();
    BIN_ID = json.metadata.id;
    localStorage.setItem('fc_bin_id', BIN_ID);
    return true;
  } catch(e) { return false; }
}

async function carregarNuvem() {
  if (!BIN_ID) return false;
  try {
    setSyncStatus('loading');
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    if (!res.ok) { setSyncStatus('error'); return false; }
    const json = await res.json();
    const dados = json.record;
    progresso  = dados.progresso  || {};
    subFavs    = dados.subFavs    || [];
    requisitos = dados.requisitos || {};
    localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
    localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
    localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
    setSyncStatus('ok');
    return true;
  } catch(e) { setSyncStatus('offline'); return false; }
}

async function salvarNuvem() {
  isSyncing = true;
  setSyncStatus('saving');
  const dados = { progresso, subFavs, requisitos };
  try {
    if (!BIN_ID) {
      await criarBin(dados);
    } else {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
        body: JSON.stringify(dados)
      });
      if (!res.ok) throw new Error('Falha');
    }
    localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
    localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
    localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
    localStorage.setItem('fc_bin_id', BIN_ID);
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus('error');
    localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
    localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
    localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
  }
  isSyncing = false;
}

function salvar() {
  localStorage.setItem('fc_joao_full_v1', JSON.stringify(progresso));
  localStorage.setItem('fc_favs_full_v1',  JSON.stringify(subFavs));
  localStorage.setItem('fc_reqs_full_v1',  JSON.stringify(requisitos));
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(salvarNuvem, 1500);
}

/* ── Datas / Estado ── */
const MESES = {jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function parseExpira(str) {
  if (!str) return null;
  const p = str.trim().toLowerCase().split(' ');
  if (p.length < 3) return null;
  const d = parseInt(p[0]), m = MESES[p[1]], y = parseInt(p[2]);
  if (isNaN(d) || m === undefined || isNaN(y)) return null;
  return new Date(y, m, d, 5, 0, 0);
}
function isExpired(group) {
  const d = parseExpira(group.expira);
  return d ? new Date() >= d : false;
}
function diasRestantes(group) {
  const d = parseExpira(group.expira);
  if (!d) return null;
  return Math.ceil((d - new Date()) / 86400000);
}
function isGroupCompleted(gIdx) {
  const group = OBJETIVOS[gIdx];
  const needed = group.minToComplete || group.tasks.length;
  let done = 0;
  group.tasks.forEach((t, tIdx) => { if ((progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total) done++; });
  return done >= needed;
}

let progresso  = JSON.parse(localStorage.getItem('fc_joao_full_v1')) || {};
let subFavs    = JSON.parse(localStorage.getItem('fc_favs_full_v1')) || [];
let requisitos = JSON.parse(localStorage.getItem('fc_reqs_full_v1')) || {};
let esconderAtivo = false;
let termoBusca = '';

async function limparTudo() {
  if (!confirm("Deseja resetar TODO o progresso? Isso não pode ser desfeito.")) return;
  progresso = {}; subFavs = []; requisitos = {};
  await salvarNuvem();
  localStorage.clear();
  location.reload();
}

async function iniciar() {
  setSyncStatus('loading');
  const ok = await carregarNuvem();
  if (!ok && !BIN_ID) {
    await criarBin({ progresso, subFavs, requisitos });
    setSyncStatus('ok');
  }
  render();
}

  esconderAtivo = !esconderAtivo;
  document.getElementById('toggleTaskBtn').classList.toggle('active', esconderAtivo);
  render();
}

function onSearch(v) {
  termoBusca = v.trim().toLowerCase();
  render();
}

function matchBusca(group) {
  if (!termoBusca) return true;
  if (group.player.toLowerCase().includes(termoBusca)) return true;
  if (group.cat.toLowerCase().includes(termoBusca)) return true;
  if ((group.recompensaFinal || '').toLowerCase().includes(termoBusca)) return true;
  return group.tasks.some(t =>
    (t.nome || '').toLowerCase().includes(termoBusca) ||
    (t.desc || '').toLowerCase().includes(termoBusca) ||
    (t.recompensa || '').toLowerCase().includes(termoBusca)
  );
}

function toggleSubFav(id) {
  subFavs = subFavs.includes(id) ? subFavs.filter(f => f !== id) : [...subFavs, id];
  salvar(); render();
}

function verificarAutoCompletar(gIdx) {
  const group = OBJETIVOS[gIdx];
  if (!group.minToComplete) return;
  let done = group.tasks.filter((t, tIdx) => (progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total).length;
  if (done >= group.minToComplete) group.tasks.forEach((t, tIdx) => progresso[`g${gIdx}t${tIdx}`] = t.total);
}

function calcGroupProgress(gIdx) {
  const group = OBJETIVOS[gIdx];
  let done = 0;
  group.tasks.forEach((t, tIdx) => { if ((progresso[`g${gIdx}t${tIdx}`] || 0) >= t.total) done++; });
  const total = group.minToComplete || group.tasks.length;
  const counted = Math.min(done, total);
  return { done: counted, total, pct: Math.round((counted / total) * 100) };
}

function setProgresso(id, val, gIdx) {
  progresso[id] = Math.max(0, val);
  verificarAutoCompletar(gIdx);
  salvar(); render();
}

/* ── Render de uma tarefa ── */
function createTaskHTML(task, id, player, gIdx, isFavContext, readonly) {
  const valor = progresso[id] || 0;
  const isDone = valor >= task.total;
  if (!readonly && esconderAtivo && isDone && !isFavContext) return null;
  const isFav = subFavs.includes(id);
  const pct = Math.min(100, Math.round((valor / task.total) * 100));

  const div = document.createElement('div');
  div.className = 'sub-obj' + (isDone ? ' done' : '');

  const rewardHTML = task.recompensa
    ? `<div class="reward-text"><span class="r-ico">🎁</span><span>${task.recompensa}</span></div>` : '';
  const descHTML = task.desc ? `<div class="desc-text">${task.desc}</div>` : '';

  div.innerHTML = `
    <div class="fav-sub-star ${isFav ? 'active' : ''}" onclick="event.stopPropagation();toggleSubFav('${id}')">★</div>
    <div class="info">
      <span class="nome-text">${isFavContext ? '<span class="ctx">[' + player + ']</span> ' : ''}${task.nome}</span>
      ${descHTML}
      ${rewardHTML}
      <span class="count ${isDone ? 'full' : ''}"><b>${valor}/${task.total}</b> &bull; ${pct}%</span>
    </div>
    <div class="progress-bg"><div class="progress-bar ${isDone ? 'full' : ''}" style="width:${pct}%"></div></div>
    <div class="counter-zone"></div>
  `;

  const zone = div.querySelector('.counter-zone');

  if (task.total <= 12) {
    // Grid de bolinhas
    const grid = document.createElement('div');
    grid.className = 'balls-grid';
    for (let i = 1; i <= task.total; i++) {
      const ball = document.createElement('div');
      ball.className = 'ball' + (i <= valor ? ' active' : '') + (readonly ? ' readonly' : '');
      ball.innerText = '⚽';
      if (!readonly) ball.onclick = () => setProgresso(id, (valor === i) ? i - 1 : i, gIdx);
      grid.appendChild(ball);
    }
    zone.appendChild(grid);
  } else {
    // Stepper para metas grandes
    const stp = document.createElement('div');
    stp.className = 'stepper';
    const jump = task.total >= 30 ? 10 : 5;
    stp.innerHTML = `
      <button class="step-btn minus ${readonly ? 'readonly' : ''}" data-act="dec">−</button>
      <button class="step-jump ${readonly ? 'readonly' : ''}" data-act="dec5">-${jump}</button>
      <div class="step-val">${valor}<small>/${task.total}</small></div>
      <button class="step-jump ${readonly ? 'readonly' : ''}" data-act="inc5">+${jump}</button>
      <button class="step-btn plus ${readonly ? 'readonly' : ''}" data-act="inc">+</button>
    `;
    if (!readonly) {
      stp.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          let v = valor;
          if (act === 'inc') v = Math.min(task.total, valor + 1);
          else if (act === 'dec') v = Math.max(0, valor - 1);
          else if (act === 'inc5') v = Math.min(task.total, valor + jump);
          else if (act === 'dec5') v = Math.max(0, valor - jump);
          setProgresso(id, v, gIdx);
        };
      });
    }
    zone.appendChild(stp);
  }
  return div;
}

/* ── Render de um card ── */
function buildCard(group, gIdx, extraClass, readonly) {
  const gp = calcGroupProgress(gIdx);
  const expired = isExpired(group);
  const dias = diasRestantes(group);

  const card = document.createElement('div');
  card.className = 'card' + (extraClass ? ' ' + extraClass : '');

  let expiLabel;
  if (!group.expira) expiLabel = `<span class="expira-label never">∞ Não expira</span>`;
  else if (expired) expiLabel = `<span class="expira-label expired-lbl">💀 ${group.expira}</span>`;
  else if (dias !== null && dias <= 1) expiLabel = `<span class="expira-label urgent">🔥 ${dias <= 0 ? 'Hoje' : '1 dia'}</span>`;
  else expiLabel = `<span class="expira-label soon">⏳ ${dias} dias</span>`;

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="player-name">${group.minToComplete ? `<span class="min-badge">${group.minToComplete}/${group.tasks.length}</span>` : ''}${group.player}</span>
    ${expiLabel}
  `;
  card.appendChild(head);

  if (group.recompensaFinal) {
    const rf = document.createElement('div');
    rf.className = 'reward-final';
    rf.innerHTML = `<span class="rf-ico">🏅</span><span class="rf-txt"><b>Recompensa final:</b> ${group.recompensaFinal}</span>`;
    card.appendChild(rf);
  }

  const progRow = document.createElement('div');
  progRow.className = 'card-progress-row';
  progRow.innerHTML = `
    <div class="card-progress-bar-bg"><div class="card-progress-bar ${gp.pct === 100 ? 'full' : ''}" style="width:${gp.pct}%"></div></div>
    <span class="card-pct-label ${gp.pct === 100 ? 'full' : ''}">${gp.done}/${gp.total} · ${gp.pct}%</span>
  `;
  card.appendChild(progRow);

  const req = document.createElement('textarea');
  req.className = 'req-box';
  req.placeholder = "📝 Notas / combos / lembretes...";
  req.value = requisitos['req-' + gIdx] || '';
  req.oninput = (e) => { requisitos['req-' + gIdx] = e.target.value; salvar(); };
  card.appendChild(req);

  group.tasks.forEach((task, tIdx) => {
    const html = createTaskHTML(task, `g${gIdx}t${tIdx}`, group.player, gIdx, false, readonly);
    if (html) card.appendChild(html);
  });
  return card;
}

/* ── Render de uma seção ── */
function renderSection(indices, container, catClass, readonly) {
  let lastCat = '';
  indices.forEach(gIdx => {
    const group = OBJETIVOS[gIdx];
    if (group.cat !== lastCat) {
      const catIdxs = indices.filter(i => OBJETIVOS[i].cat === group.cat);
      let catDone = 0, catTotal = 0;
      catIdxs.forEach(i => { const p = calcGroupProgress(i); catDone += p.done; catTotal += p.total; });
      const catPct = catTotal > 0 ? Math.round((catDone / catTotal) * 100) : 0;
      const h = document.createElement('div');
      h.className = 'category-header ' + catClass;
      h.innerHTML = `<span class="cat-left">${CAT_ICONS[group.cat] || '📁'} ${group.cat}</span><span class="cat-pct ${catPct === 100 ? 'full' : ''}">${catPct}%</span>`;
      container.appendChild(h);
      lastCat = group.cat;
    }
    const card = buildCard(group, gIdx, catClass === 'exp' ? 'expired' : catClass === 'done-cat' ? 'completed' : '', readonly);
    if (catClass === '' && esconderAtivo) {
      const hasTasks = card.querySelectorAll('.sub-obj').length > 0;
      if (!hasTasks) return;
    }
    container.appendChild(card);
  });
}

/* ── Render principal ── */
function render() {
  const appAtivos = document.getElementById('app-ativos');
  const appConcluidos = document.getElementById('app-concluidos');
  const appExpirados = document.getElementById('app-expirados');
  const favCont = document.getElementById('fav-container');
  appAtivos.innerHTML = ''; appConcluidos.innerHTML = ''; appExpirados.innerHTML = ''; favCont.innerHTML = '';

  const ativos = [], concluidos = [], expirados = [];
  OBJETIVOS.forEach((group, gIdx) => {
    if (!matchBusca(group)) return;
    if (isExpired(group)) expirados.push(gIdx);
    else if (isGroupCompleted(gIdx)) concluidos.push(gIdx);
    else ativos.push(gIdx);
  });

  ativos.sort((a, b) => {
    const dA = parseExpira(OBJETIVOS[a].expira);
    const dB = parseExpira(OBJETIVOS[b].expira);
    if (dA && dB) return dA - dB;
    if (dA) return -1;
    if (dB) return 1;
    return 0;
  });

  document.getElementById('badge-ativos').textContent = ativos.length;
  document.getElementById('badge-concluidos').textContent = concluidos.length;
  document.getElementById('badge-expirados').textContent = expirados.length;

  let gDone = 0, gTotal = 0;
  ativos.forEach(gIdx => { const p = calcGroupProgress(gIdx); gDone += p.done; gTotal += p.total; });
  const gPct = gTotal > 0 ? Math.round((gDone / gTotal) * 100) : 0;
  document.getElementById('global-pct-text').textContent = gPct + '%';
  document.getElementById('global-bar').style.width = gPct + '%';

  // Favoritos
  if (subFavs.length > 0) {
    const card = document.createElement('div'); card.className = 'card';
    let hasFavs = false;
    OBJETIVOS.forEach((group, gIdx) => group.tasks.forEach((task, tIdx) => {
      const id = `g${gIdx}t${tIdx}`;
      if (subFavs.includes(id)) {
        const html = createTaskHTML(task, id, group.player, gIdx, true, false);
        if (html) { card.appendChild(html); hasFavs = true; }
      }
    }));
    if (hasFavs) {
      const head = document.createElement('div'); head.className = 'category-header fav';
      head.innerHTML = `<span class="cat-left">⭐ Em Foco</span>`;
      favCont.appendChild(head);
      favCont.appendChild(card);
    }
  }

  if (ativos.length === 0) appAtivos.innerHTML = '<div class="empty-state"><span class="es-ico">🎉</span>Nenhum objetivo ativo no momento</div>';
  else renderSection(ativos, appAtivos, '', false);

  if (concluidos.length === 0) appConcluidos.innerHTML = '<div class="empty-state"><span class="es-ico">⚽</span>Nenhum objetivo concluído ainda.<br>Vai jogar!</div>';
  else renderSection(concluidos, appConcluidos, 'done-cat', false);

  if (expirados.length === 0) appExpirados.innerHTML = '<div class="empty-state"><span class="es-ico">👍</span>Nenhum objetivo expirado. Boa!</div>';
  else renderSection(expirados, appExpirados, 'exp', true);
}

iniciar();
</script>
</body>
</html>
